name: Native Unix offline release acceptance

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing candidate release tag to verify
        required: true
        default: v1.1.1-offline
        type: string

permissions:
  contents: read

jobs:
  acceptance:
    uses: ./.github/workflows/unix-offline-smoke.yml
    with:
      release_tag: ${{ inputs.release_tag }}
